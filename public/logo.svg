<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Smart Gym Finance Manager">
  <defs>
    <linearGradient id="sgfm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.45" stop-color="#059669"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="sgfm-sheen" cx="0.2" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sgfm-line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="sgfm-plate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="sgfm-plate-outer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d1fae5"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>

  <!-- Tile: emerald gradient, soft top-left sheen, fine inner rim -->
  <rect width="64" height="64" rx="14" fill="url(#sgfm-bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#sgfm-sheen)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Faint chart gridlines -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.75" stroke-linecap="round">
    <line x1="10" y1="18" x2="54" y2="18"/>
    <line x1="10" y1="28" x2="54" y2="28"/>
    <line x1="10" y1="38" x2="54" y2="38"/>
    <line x1="10" y1="48" x2="54" y2="48"/>
  </g>

  <!-- Trendbell: a dumbbell whose bar is a rising chart line -->
  <g transform="translate(32 31.5) scale(0.2) translate(-128 -128)">
    <!-- soft shadow -->
    <g fill="#022c22" stroke="#022c22" opacity="0.28" transform="translate(4 9)">
      <polyline points="54,174 106,122 132,148 196,84" fill="none" stroke-width="26" stroke-linejoin="round"/>
      <rect x="38" y="134" width="30" height="80" rx="10" stroke="none"/>
      <rect x="10" y="152" width="22" height="44" rx="8" stroke="none"/>
      <rect x="188" y="44" width="30" height="80" rx="10" stroke="none"/>
      <rect x="224" y="62" width="22" height="44" rx="8" stroke="none"/>
    </g>
    <polyline points="54,174 106,122 132,148 196,84" fill="none" stroke="url(#sgfm-line)" stroke-width="26" stroke-linejoin="round"/>
    <!-- plates with cylinder shading -->
    <rect x="10" y="152" width="22" height="44" rx="8" fill="url(#sgfm-plate-outer)"/>
    <rect x="38" y="134" width="30" height="80" rx="10" fill="url(#sgfm-plate)"/>
    <rect x="224" y="62" width="22" height="44" rx="8" fill="url(#sgfm-plate-outer)"/>
    <rect x="188" y="44" width="30" height="80" rx="10" fill="url(#sgfm-plate)"/>
    <!-- groove: each big plate reads as two stacked discs -->
    <g fill="#34d399" opacity="0.55">
      <rect x="51.5" y="142" width="3" height="64" rx="1.5"/>
      <rect x="201.5" y="52" width="3" height="64" rx="1.5"/>
    </g>
  </g>
</svg>
