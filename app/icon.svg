<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Smart Gym Finance Manager">
  <defs>
    <linearGradient id="sgfm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sgfm-bg)"/>
  <!-- Rising trend line: the gym's money going up -->
  <polyline points="15,27 25,20 32,24 46,13" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="39,13 46,13 46,20" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dumbbell -->
  <rect x="20" y="40" width="24" height="4" rx="2" fill="#ffffff"/>
  <rect x="15" y="33" width="6" height="18" rx="2" fill="#ffffff"/>
  <rect x="9" y="36" width="5" height="12" rx="2" fill="#ffffff"/>
  <rect x="43" y="33" width="6" height="18" rx="2" fill="#ffffff"/>
  <rect x="50" y="36" width="5" height="12" rx="2" fill="#ffffff"/>
</svg>
